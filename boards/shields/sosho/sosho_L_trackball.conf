# Shared keymap uses &studio_unlock; keep its behavior available on peripherals.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_SAME_KEY_HOLD=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_KEYBOARD_NAME="sosho"

# The left module sends its key and pointing reports over the split link.
CONFIG_ZMK_SPLIT=y

#BLE connect
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_PHY_2M=n
# Do not enable passkey entry on the peripheral either; normal pairing should
# complete without asking the host for a PIN.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
# Keep the split Peripheral link responsive for keys, encoder, and pointing.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#enable mouse
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=n

#SPI
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
#PMW3610
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# Keep the sensor power-up margin without adding the earlier one-second
# pause observed when the wireless central woke the pointing device.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=40

#encoder sensitive
#CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

#use NFC pins
#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y
CONFIG_RGBLED_WIDGET_CONN_SOLID=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y
CONFIG_WARN_DEPRECATED=n
