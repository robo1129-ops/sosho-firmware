CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_DIRECT_WEB=y
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_SAME_KEY_HOLD=y
CONFIG_ZMK_KEYBOARD_NAME="sosho"

# The SO-SHO central receives the other module's key and pointing reports.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Pointer reports from the split peripheral must not be held back by BLE
# slave latency. A non-zero value makes trackpad motion arrive in bursts.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0
# Macro payloads are larger than the upstream Studio default receive buffer.
# Keep the full protobuf request in one RPC frame so setMacro is not dropped.
# The complete keymap/behavior response can exceed the upstream defaults.
# Keep enough room for one framed request or response so it is never truncated
# before the USB CDC or BLE transport can drain it.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=2048
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=2048
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
# USB is used for charging and the ZMK Studio RPC only. Host input is BLE-only.
CONFIG_ZMK_USB_HID=n
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SETTINGS=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=n
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=n
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=y
CONFIG_RGBLED_WIDGET_CONN_SOLID=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_LOW=4
CONFIG_RGBLED_WIDGET_BATTERY_COLOR_CRITICAL=4
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_BAS=y
CONFIG_WARN_DEPRECATED=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_USB_LOGGING=n
