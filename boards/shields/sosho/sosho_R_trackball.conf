# Explicitly keep the upstream default BLE GATT Studio transport on.
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y

CONFIG_ZMK_KEYBOARD_NAME="sosho"

#BLE connect
CONFIG_ZMK_BLE=y
# Keep the upstream Windows-oriented connection stability mitigation (1M
# PHY), but do not require passkey entry during normal pairing.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Windows BLE adapters are more reliable with the 1M PHY on this split
# central. The upstream ZMK troubleshooting guide recommends disabling the
# 2M PHY for connection failures on some Windows chipsets.
CONFIG_BT_CTLR_PHY_2M=n
# PIN/passkey entry is intentionally disabled for normal pairing.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
#CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

#ZMK STUDIO
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=0

# Keep the USB Studio RPC endpoint explicit as well as enabled by the
# studio-rpc-usb-uart snippet. This prevents a board/shield configuration
# override from silently leaving the CDC-ACM transport out of the central
# build.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# SO-SHO runtime macro BLE service. Macro edits are persisted at runtime;
# this build is required only once before using the web editor.
CONFIG_SETTINGS=y
CONFIG_BT_SMP=y
# One split-peripheral connection plus the five host profiles supported by
# ZMK. The split-central docs recommend one extra connection slot.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# Work around the Windows GATT notification subscription issue documented by
# ZMK; keyboard and pointing reports must remain usable when paired.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

#enable encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#enable mouse
CONFIG_ZMK_MOUSE=y

#SPI
CONFIG_ZMK_POINTING=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_INPUT_INIT_PRIORITY=99
#PMW3610
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

#encoder sensitive
#CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=128

#use NFC pins
CONFIG_NFCT_PINS_AS_GPIOS=y

#RGBLED_WIDGET
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

#BATTERY
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_BT_BAS=y

# SPLIT: keep the position-state path independent from battery GATT
# discovery. ZMK issue #3156 documents intermittent missing peripheral input
# when central battery fetching is enabled during discovery.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

CONFIG_ZMK_USB_LOGGING=n
