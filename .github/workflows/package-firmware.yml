name: Package firmware ZIP

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the successful firmware build
        id: resolve-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&event=push&per_page=50")"
            build="$(jq -c --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.name == "Build ZMK firmware")
                | select(.head_sha == $sha)
                | select(.status == "completed")
                | select(.conclusion == "success")]
              | sort_by(.run_number) | last // empty
            ' <<<"$runs")"
            if [[ -n "$build" && "$build" != "null" ]]; then
              echo "run_id=$(jq -r '.id' <<<"$build")" >> "$GITHUB_OUTPUT"
              echo "build_sha=$(jq -r '.head_sha' <<<"$build")" >> "$GITHUB_OUTPUT"
              echo "build_url=$(jq -r '.html_url' <<<"$build")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              sleep 20
            fi
          done
          echo "No successful Build ZMK firmware run found for $TARGET_SHA" >&2
          exit 1

      - name: Download all firmware variants
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/firmware
          run-id: ${{ steps.resolve-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arrange firmware by sleep mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firmware/sleep-5m dist/firmware/sleep-15m dist/firmware/sleep-30m dist/firmware/sleep-60m dist/firmware/sleep-off dist/firmware/recovery
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              sleep-5m_*) bucket="sleep-5m"; clean="${name#sleep-5m_}" ;;
              sleep-15m_*) bucket="sleep-15m"; clean="${name#sleep-15m_}" ;;
              sleep-30m_*) bucket="sleep-30m"; clean="${name#sleep-30m_}" ;;
              sleep-60m_*) bucket="sleep-60m"; clean="${name#sleep-60m_}" ;;
              sleep-off_*) bucket="sleep-off"; clean="${name#sleep-off_}" ;;
              settings_reset*) bucket="recovery"; clean="$name" ;;
              *) bucket="sleep-60m"; clean="$name" ;;
            esac
            mv "$file" "dist/firmware/$bucket/$clean"
          done < <(find dist/firmware -maxdepth 1 -type f -print0)

      - name: Add variant manifest
        env:
          BUILD_SHA: ${{ steps.resolve-build.outputs.build_sha }}
          BUILD_URL: ${{ steps.resolve-build.outputs.build_url }}
        run: |
          cat > dist/README.txt <<EOF
          SO-SHO custom firmware

          Build commit: ${BUILD_SHA}
          Build run: ${BUILD_URL}

          Normal pair:
            sosho_R_trackball = right / Central / trackball
            sosho_L_trackpad  = left / Peripheral / trackpad

          Alternate pair:
            sosho_R_trackpad  = right / Central / trackpad
            sosho_L_trackball = left / Peripheral / trackball

          The left trackpad uses Pinnacle sensitivity 1x and a 1/1 movement
          scale so small motion is not attenuated during hardware validation.
          The standard trackpad profile uses the official Pinnacle relative mode,
          primary tap, and host-side double-click interpretation. Right-side
          trackpad builds invert both X and Y for the physical orientation.
          Right-click, held-contact right drag, and trackpad edge scrolling are
          intentionally excluded from this stable package. The right Central
          profiles expose the official ZMK Studio USB and BLE transports.

          settings_reset is a separate recovery image. Do not flash it as a normal half.

          Firmware is grouped by automatic-sleep timeout:
            sleep-5m/    = 5 minutes
            sleep-15m/   = 15 minutes
            sleep-30m/   = 30 minutes
            sleep-60m/   = 1 hour
            sleep-off/   = automatic sleep disabled

          Each folder contains the same hardware/profile combinations. Select matching
          right/left UF2 files from one folder before flashing. A separate recovery/
          folder is used for settings_reset when that image is present.
          EOF

      - name: Add multilingual firmware guides
        shell: bash
        run: |
          set -euo pipefail
          for bucket in sleep-5m sleep-15m sleep-30m sleep-60m sleep-off; do
            mkdir -p "dist/firmware/${bucket}"
            cat > "dist/firmware/${bucket}/README-ja.txt" <<'EOF'
            SO-SHO ファームウェア

            このフォルダ内で右側と左側のUF2を1つずつ選び、同じスリープ設定の組み合わせで書き込んでください。
            右側CentralはUSB接続用、左側は分割Peripheral用です。
            右側トラックパッド版は物理配置に合わせてX/Y両軸を反転しています。
            トラックパッドは公式relative modeとprimary tapを使用します。右クリック、長押し右ドラッグ、外周スクロールは非対応です。
            EOF
            cat > "dist/firmware/${bucket}/README-en.txt" <<'EOF'
            SO-SHO firmware

            Choose one right-side UF2 and one left-side UF2 from this folder and flash the matching sleep profile.
            The right Central side is the USB host-facing side; the left side is the split Peripheral.
            Right-side trackpad builds invert both X and Y for the physical placement.
            Trackpads use the official relative mode and primary tap. Right-click, held right-drag, and edge scrolling are not included.
            EOF
            cat > "dist/firmware/${bucket}/README-zh-CN.txt" <<'EOF'
            SO-SHO 固件

            请从本文件夹选择一个右侧 UF2 和一个左侧 UF2，并使用相同的休眠配置刷写。
            右侧 Central 连接 USB，左侧作为分体 Peripheral。
            右侧触控板固件会根据实体方向反转 X/Y 两个轴。
            触控板使用官方相对模式和主点击。不包含右键、按住右拖以及外圈滚动。
            EOF
            cat > "dist/firmware/${bucket}/README-ko.txt" <<'EOF'
            SO-SHO 펌웨어

            이 폴더에서 오른쪽 UF2 하나와 왼쪽 UF2 하나를 선택하고 같은 절전 설정으로 플래시하세요.
            오른쪽 Central은 USB 연결용이며 왼쪽은 분할 Peripheral입니다.
            오른쪽 트랙패드 펌웨어는 실제 배치에 맞춰 X/Y 축을 모두 반전합니다.
            트랙패드는 공식 상대 모드와 기본 탭을 사용합니다. 우클릭, 누른 상태의 우 드래그, 가장자리 스크롤은 포함하지 않습니다.
            EOF
            cat > "dist/firmware/${bucket}/README-th.txt" <<'EOF'
            เฟิร์มแวร์ SO-SHO

            เลือกไฟล์ UF2 ฝั่งขวาและฝั่งซ้ายอย่างละหนึ่งไฟล์จากโฟลเดอร์นี้ และแฟลชด้วยการตั้งค่าสลีปเดียวกัน
            ฝั่งขวา Central ใช้เชื่อมต่อ USB ส่วนฝั่งซ้ายเป็น Peripheral แบบแยกส่วน
            เฟิร์มแวร์แทร็กแพดฝั่งขวาจะกลับแกน X/Y ให้ตรงกับตำแหน่งจริง
            แทร็กแพดใช้โหมดสัมพัทธ์อย่างเป็นทางการและการแตะหลัก ไม่รวมคลิกขวา การลากขวาขณะกดค้าง หรือการเลื่อนขอบ
            EOF
          done

      - name: Create firmware ZIP
        run: |
          cd dist
          zip -r ../sosho-firmware-latest.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sosho-firmware-zip
          path: sosho-firmware-latest.zip
          retention-days: 90

      - name: Publish stable latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ steps.resolve-build.outputs.build_sha }}
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "SO-SHO firmware (latest)" \
              --notes "All SO-SHO firmware variants from the latest successful build."
          fi
          gh release upload latest sosho-firmware-latest.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
