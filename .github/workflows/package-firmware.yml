name: Package firmware ZIP

on:
  workflow_run:
    workflows: ["Build SO-SHO firmware with custom ZMK extensions"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/firmware
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arrange runtime firmware profiles
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/firmware/runtime_*.uf2 dist/firmware/runtime_*.bin; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            clean="${name#runtime_}"
            mv "$file" "dist/firmware/$clean"
          done

      - name: Add multilingual guide
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/README.txt <<'EOF'
          SO-SHO runtime-sleep firmware

          This package contains one firmware per hardware profile. Automatic sleep
          is no longer split into separate folders: after flashing a runtime-sleep
          build, choose Off or 1–1440 minutes in the SO-SHO Web editor and save it.
          The build default before the first save is 30 minutes.

          Normal pair:
            sosho_R_trackball.uf2 = right / Central / trackball
            sosho_L_trackpad.uf2  = left / Peripheral / trackpad

          Alternate profiles are provided for right trackpad, left trackball, and
          either blank module. Flash matching right and left profiles as a pair.
          The right Central firmware provides the USB and BLE Studio transports.
          The sleep setting is stored in firmware settings and is restored after reboot.
          EOF
          cat > dist/README-ja.txt <<'EOF'
          SO-SHO 実行時スリープ対応ファームウェア

          ハードウェア構成ごとに1種類のファームウェアを収録しています。
          スリープ時間ごとのフォルダは廃止しました。書き込み後、SO-SHO Webアプリで
          「オフ」または1〜1440分を選び、保存してください。初回保存前の標準値は30分です。

          通常構成は右Centralの sosho_R_trackball.uf2 と、左Peripheralの
          sosho_L_trackpad.uf2 です。左右のUF2は対応する構成を1つずつ選びます。
          スリープ設定はファームウェア設定へ保存され、再起動後も維持されます。
          EOF
          cat > dist/README-zh-CN.txt <<'EOF'
          SO-SHO 运行时休眠固件

          每种硬件配置只提供一个固件。不再按休眠时间分文件夹。刷写后在 SO-SHO Web
          应用中选择关闭或 1–1440 分钟并保存。首次保存前的默认值为 30 分钟。
          请选择匹配的右侧 Central 和左侧 Peripheral 固件。设置会保存到固件并在重启后保留。
          EOF
          cat > dist/README-ko.txt <<'EOF'
          SO-SHO 런타임 절전 펌웨어

          하드웨어 프로필마다 하나의 펌웨어만 제공합니다. 절전 시간별 폴더는 삭제되었습니다.
          플래시 후 SO-SHO 웹 앱에서 끄기 또는 1~1440분을 선택해 저장하세요. 최초 기본값은 30분입니다.
          일치하는 오른쪽 Central과 왼쪽 Peripheral 펌웨어를 선택하세요. 설정은 재부팅 후에도 유지됩니다.
          EOF
          cat > dist/README-th.txt <<'EOF'
          เฟิร์มแวร์สลีปขณะทำงานของ SO-SHO

          มีเฟิร์มแวร์หนึ่งชุดต่อโปรไฟล์ฮาร์ดแวร์ ไม่แยกโฟลเดอร์ตามเวลาอีกต่อไป หลังแฟลชแล้ว
          เลือกปิดหรือ 1–1440 นาทีในเว็บ SO-SHO และบันทึก ค่าเริ่มต้นก่อนบันทึกครั้งแรกคือ 30 นาที
          ให้เลือกเฟิร์มแวร์ Central ด้านขวาและ Peripheral ด้านซ้ายที่ตรงกัน การตั้งค่าจะคงอยู่หลังรีบูต
          EOF

      - name: Create firmware ZIP
        run: |
          cd dist
          zip -r ../sosho-firmware-latest.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sosho-firmware-zip
          path: sosho-firmware-latest.zip
          retention-days: 90

      - name: Publish stable latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "SO-SHO firmware (latest)" --notes "Runtime-sleep firmware profiles from the latest successful build."
          fi
          gh release upload latest sosho-firmware-latest.zip --repo "$GITHUB_REPOSITORY" --clobber
