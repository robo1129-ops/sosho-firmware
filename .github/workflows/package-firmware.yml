name: Package firmware ZIP

on:
  workflow_run:
    workflows: ["Build ZMK firmware"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware variants
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/firmware
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arrange firmware by sleep mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/firmware/sleep-5m dist/firmware/sleep-15m dist/firmware/sleep-30m dist/firmware/sleep-60m dist/firmware/sleep-off dist/firmware/recovery
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              sleep-5m_*) bucket="sleep-5m"; clean="${name#sleep-5m_}" ;;
              sleep-15m_*) bucket="sleep-15m"; clean="${name#sleep-15m_}" ;;
              sleep-30m_*) bucket="sleep-30m"; clean="${name#sleep-30m_}" ;;
              sleep-60m_*) bucket="sleep-60m"; clean="${name#sleep-60m_}" ;;
              sleep-off_*) bucket="sleep-off"; clean="${name#sleep-off_}" ;;
              settings_reset*) bucket="recovery"; clean="$name" ;;
              *) bucket="sleep-60m"; clean="$name" ;;
            esac
            mv "$file" "dist/firmware/$bucket/$clean"
          done < <(find dist/firmware -maxdepth 1 -type f -print0)

      - name: Add variant manifest
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          cat > dist/README.txt <<EOF
          SO-SHO custom firmware

          Build commit: ${BUILD_SHA}
          Build run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}

          Normal pair:
            sosho_R_trackball = right / Central / trackball
            sosho_L_trackpad  = left / Peripheral / trackpad

          Alternate pair:
            sosho_R_trackpad  = right / Central / trackpad
            sosho_L_trackball = left / Peripheral / trackball

          The left trackpad uses Pinnacle sensitivity 1x and a 1/1 movement
          scale so small motion is not attenuated during hardware validation.
          The standard trackpad profile supports primary tap, held-contact drag,
          and host-side double-click interpretation. The right Central profiles
          expose the official ZMK Studio USB and BLE transports.

          settings_reset is a separate recovery image. Do not flash it as a normal half.

          Firmware is grouped by automatic-sleep timeout:
            sleep-5m/    = 5 minutes
            sleep-15m/   = 15 minutes
            sleep-30m/   = 30 minutes
            sleep-60m/   = 1 hour
            sleep-off/   = automatic sleep disabled

          Each folder contains the same hardware/profile combinations. Select matching
          right/left UF2 files from one folder before flashing. A separate recovery/
          folder is used for settings_reset when that image is present.
          EOF

      - name: Create firmware ZIP
        run: |
          cd dist
          zip -r ../sosho-firmware-latest.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sosho-firmware-zip
          path: sosho-firmware-latest.zip
          retention-days: 90

      - name: Publish stable latest release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "SO-SHO firmware (latest)" \
              --notes "All SO-SHO firmware variants from the latest successful build."
          fi
          gh release upload latest sosho-firmware-latest.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
