---
include:
  # Every hardware profile is built for each selectable sleep mode.
  # The right-side Central profiles keep the Studio USB/BLE transport.
  - board: xiao_ble/nrf52840/zmk
    shield: sosho_R_trackball rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
    artifact-name: sleep-5m_sosho_R_trackball

  - board: xiao_ble/nrf52840/zmk
    shield: sosho_R_trackball rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_TRANSPORT_BLE=y -DCONFIG_ZMK_SLEEP=y -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
    artifact-name: sleep-15m_sosho_R_trackball

